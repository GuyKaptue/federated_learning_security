name: packaging
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: install requirements in clean environment and import wheel
        run: |
          python -m venv /tmp/venv && /tmp/venv/bin/pip install -r requirements.txt
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/python -c "import federated_learning as f; print(f.__version__)"
